spring:
  application:
    name: backend
  datasource:
    url: jdbc:mysql://localhost:3306/wedge?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: root
    password: root123414
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  security:
    oauth2:
      client:
        registration:
          kakao:
            client-id: ${KAKAO_CLIENT_ID}
            client-secret: ${KAKAO_CLIENT_SECRET}
            redirect-uri: "{baseUrl}/login/oauth2/code/kakao"
            authorization-grant-type: authorization_code
            client-authentication-method: client_secret_post
            scope: profile_nickname, account_email
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            redirect-uri: "{baseUrl}/login/oauth2/code/google"
            scope: profile, email
        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id

jwt:
  secret: ${JWT_SECRET}
  expiration: 86400000
  refresh-expiration: 604800000

cloud:
  aws:
    s3:
      endpoint: https://18a0add865a6d997171f11f38859d5d9.r2.cloudflarestorage.com
      bucket: wedge-storage
    credentials:
      access-key: 2b2cfd4f52b35bbb54cf54ec6581c88c
      secret-key: bc659f7c2d5d06d3d565d5098c23345c6ddf4abbfe7bd2bbaa99be0a623a19dc
    region:
      static: auto

server:
  tomcat:
    max-http-request-header-size: 65536

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs